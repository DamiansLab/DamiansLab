<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Damian's Lab — Full-Stack Developer and 3D Designer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .edge { stroke: #F18E45; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 6s ease-in-out infinite; }
    .edge.d1 { animation-delay: .15s; } .edge.d2 { animation-delay: .3s; } .edge.d3 { animation-delay: .45s; }
    .edge.d4 { animation-delay: .6s; } .edge.d5 { animation-delay: .75s; }
    .ghost { stroke: #F18E45; stroke-opacity: .12; stroke-width: 1; }
    .ring { transform-origin: 960px 150px; animation: spin 40s linear infinite; }
    .ring2 { transform-origin: 960px 150px; animation: spin 60s linear infinite reverse; }
    .vertex { fill: #F18E45; animation: pulse 3s ease-in-out infinite; }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { 0% { stroke-dashoffset: 120; } 35%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { 0%, 100% { transform: translateY(-70px); opacity: 0; } 20%, 80% { opacity: .5; } 50% { transform: translateY(70px); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .ring, .ring2, .vertex, .scan { animation: none; }
      .edge { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".06"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 150) scale(320 220)">
      <stop stop-color="#F18E45" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F18E45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F18E45" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#F18E45" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F18E45" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F18E45"/>
      <stop offset="1" stop-color="#F18E45" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="300" fill="#0A0A0B"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" stroke="url(#border)" stroke-width="1.5"/>

  <!-- Left: identity -->
  <text x="64" y="92" class="mono" font-size="15" fill="#F18E45" letter-spacing="3">// DAMIANSLAB</text>
  <text x="62" y="160" class="sans" font-size="60" font-weight="800" fill="#F5F5F5" letter-spacing="-1.5">Damian's Lab<tspan fill="#F18E45">.</tspan></text>
  <text x="64" y="202" class="sans" font-size="21" fill="#A8A8A8">Full-Stack Developer · 3D Designer · Greece</text>
  <text x="64" y="248" class="mono" font-size="15" fill="#6B6B6B">$ <tspan fill="#C9C9C9">designing digital · fabricating physical</tspan><tspan class="cursor" fill="#F18E45"> ▍</tspan></text>

  <!-- Right: wireframe object -->
  <g class="ring">
    <circle cx="960" cy="150" r="118" stroke="#F18E45" stroke-opacity=".18" stroke-dasharray="2 8"/>
    <circle cx="1078" cy="150" r="3" fill="#F18E45" fill-opacity=".6"/>
  </g>
  <g class="ring2">
    <circle cx="960" cy="150" r="96" stroke="#FFFFFF" stroke-opacity=".06"/>
    <circle cx="864" cy="150" r="2" fill="#FFFFFF" fill-opacity=".5"/>
  </g>

  <!-- hidden edges -->
  <path class="ghost" d="M960 150 L960 222 M960 150 L898 114 M960 150 L1022 114" stroke-dasharray="3 4"/>
  <!-- isometric cube: top face, sides -->
  <path class="edge"    d="M960 78 L1022 114 L960 150 L898 114 Z"/>
  <path class="edge d1" d="M898 114 L898 186"/>
  <path class="edge d2" d="M1022 114 L1022 186"/>
  <path class="edge d3" d="M960 150 L960 222"/>
  <path class="edge d4" d="M898 186 L960 222"/>
  <path class="edge d5" d="M1022 186 L960 222"/>

  <circle class="vertex" cx="960" cy="78"  r="3.5"/>
  <circle class="vertex" cx="898" cy="114" r="3.5" style="animation-delay:-.5s"/>
  <circle class="vertex" cx="1022" cy="114" r="3.5" style="animation-delay:-1s"/>
  <circle class="vertex" cx="960" cy="150" r="3.5" style="animation-delay:-1.5s"/>
  <circle class="vertex" cx="898" cy="186" r="3.5" style="animation-delay:-2s"/>
  <circle class="vertex" cx="1022" cy="186" r="3.5" style="animation-delay:-2.5s"/>
  <circle class="vertex" cx="960" cy="222" r="3.5" style="animation-delay:-3s"/>

  <!-- scanning line, like a printer head -->
  <rect class="scan" x="880" y="149" width="160" height="2" fill="url(#scanline)"/>

  <text x="960" y="272" class="mono" font-size="11" fill="#F18E45" fill-opacity=".55" text-anchor="middle" letter-spacing="2">CODE → OBJECT</text>
</svg>
