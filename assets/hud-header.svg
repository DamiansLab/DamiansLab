<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DamiansLab — websites, custom software and 3D printing">
  <style>
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .status { animation: pulse 2s ease-in-out infinite; }
    .edge { stroke: #2FA3D4; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw 6s ease-in-out infinite; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; } .d4 { animation-delay: .6s; } .d5 { animation-delay: .75s; }
    .spin { transform-origin: 960px 172px; animation: spin 50s linear infinite; }
    .spin2 { transform-origin: 960px 172px; animation: spin 28s linear infinite reverse; }
    .vx { fill: #59B0DA; animation: pulse 3s ease-in-out infinite; }
    .scan { animation: scan 4.5s ease-in-out infinite; }
    .sweep { animation: sweep 9s linear infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes draw { 0% { stroke-dashoffset: 130; } 35%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -130; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { 0%, 100% { transform: translateY(-78px); opacity: 0; } 15%, 85% { opacity: .7; } 50% { transform: translateY(78px); } }
    @keyframes sweep { 0% { transform: translateX(-300px); } 100% { transform: translateX(1300px); } }
    @media (prefers-reduced-motion: reduce) {
      .blink, .status, .spin, .spin2, .vx, .scan, .sweep { animation: none; }
      .edge { animation: none; stroke-dashoffset: 0; }
      .scan, .sweep { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" stroke="#2FA3D4" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 172) scale(340 240)">
      <stop stop-color="#2FA3D4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2FA3D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="110" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2FA3D4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#59B0DA"/>
      <stop offset="1" stop-color="#2FA3D4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="318" rx="2"/></clipPath>
  </defs>

  <rect x=".5" y=".5" width="1199" height="319" rx="2" fill="#181D20"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="2" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="2" stroke="#2F3437"/>
  <path d="M0.75 16.75 V0.75 H16.75 M1183.25 0.75 H1199.25 V16.75 M1199.25 303.25 V319.25 H1183.25 M16.75 319.25 H0.75 V303.25" stroke="#2FA3D4" stroke-width="1.5"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="48" width="300" height="1" fill="url(#beam)"/>
  </g>

  <!-- status bar -->
  <path d="M1 48.5 H1199" stroke="#2F3437"/>
  <circle class="status" cx="36" cy="25" r="4" fill="#2FA3D4"/>
  <text x="52" y="29" class="mono" font-size="12" fill="#2FA3D4" letter-spacing="2">SYS.ONLINE</text>
  <text x="160" y="29" class="mono" font-size="12" fill="#8B9092" letter-spacing="2">DAMIANSLAB // ATTICA, GR</text>
  <text x="1168" y="29" class="mono" font-size="12" fill="#8B9092" letter-spacing="2" text-anchor="end">37.98°N 23.72°E · v2026</text>

  <!-- identity -->
  <text x="64" y="112" class="mono" font-size="13" fill="#2FA3D4" letter-spacing="3">&gt; INIT LAB_PROFILE</text>
  <text x="61" y="186" class="sans" font-size="76" font-weight="700" fill="url(#title)" letter-spacing="-2.5">DamiansLab<tspan class="blink" fill="#2FA3D4">_</tspan></text>
  <text x="64" y="228" class="sans" font-size="21" fill="#9FA3A5">Websites <tspan fill="#2FA3D4">/</tspan> Custom software <tspan fill="#2FA3D4">/</tspan> 3D printing</text>
  <path d="M64 252 H420" stroke="#2F3437"/>
  <path d="M64 252 H124" stroke="#2FA3D4" stroke-width="2"/>
  <text x="64" y="282" class="mono" font-size="13" fill="#8B9092" letter-spacing="1">FULL-STACK DEVELOPER  ·  3D DESIGNER  ·  GREECE</text>

  <!-- reticle + wireframe -->
  <g stroke="#2FA3D4" stroke-opacity=".35" class="spin"><path d="M960 44 V58" transform="rotate(0 960 172)"/><path d="M960 44 V52" transform="rotate(10 960 172)"/><path d="M960 44 V52" transform="rotate(20 960 172)"/><path d="M960 44 V58" transform="rotate(30 960 172)"/><path d="M960 44 V52" transform="rotate(40 960 172)"/><path d="M960 44 V52" transform="rotate(50 960 172)"/><path d="M960 44 V58" transform="rotate(60 960 172)"/><path d="M960 44 V52" transform="rotate(70 960 172)"/><path d="M960 44 V52" transform="rotate(80 960 172)"/><path d="M960 44 V58" transform="rotate(90 960 172)"/><path d="M960 44 V52" transform="rotate(100 960 172)"/><path d="M960 44 V52" transform="rotate(110 960 172)"/><path d="M960 44 V58" transform="rotate(120 960 172)"/><path d="M960 44 V52" transform="rotate(130 960 172)"/><path d="M960 44 V52" transform="rotate(140 960 172)"/><path d="M960 44 V58" transform="rotate(150 960 172)"/><path d="M960 44 V52" transform="rotate(160 960 172)"/><path d="M960 44 V52" transform="rotate(170 960 172)"/><path d="M960 44 V58" transform="rotate(180 960 172)"/><path d="M960 44 V52" transform="rotate(190 960 172)"/><path d="M960 44 V52" transform="rotate(200 960 172)"/><path d="M960 44 V58" transform="rotate(210 960 172)"/><path d="M960 44 V52" transform="rotate(220 960 172)"/><path d="M960 44 V52" transform="rotate(230 960 172)"/><path d="M960 44 V58" transform="rotate(240 960 172)"/><path d="M960 44 V52" transform="rotate(250 960 172)"/><path d="M960 44 V52" transform="rotate(260 960 172)"/><path d="M960 44 V58" transform="rotate(270 960 172)"/><path d="M960 44 V52" transform="rotate(280 960 172)"/><path d="M960 44 V52" transform="rotate(290 960 172)"/><path d="M960 44 V58" transform="rotate(300 960 172)"/><path d="M960 44 V52" transform="rotate(310 960 172)"/><path d="M960 44 V52" transform="rotate(320 960 172)"/><path d="M960 44 V58" transform="rotate(330 960 172)"/><path d="M960 44 V52" transform="rotate(340 960 172)"/><path d="M960 44 V52" transform="rotate(350 960 172)"/></g>
  <circle cx="960" cy="172" r="112" stroke="#2F3437"/>
  <g class="spin2">
    <path d="M960 72 A100 100 0 0 1 1060 172" stroke="#2FA3D4" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M960 272 A100 100 0 0 1 860 172" stroke="#2FA3D4" stroke-opacity=".25" stroke-width="1.5"/>
  </g>
  <path d="M820 172 H842 M1078 172 H1100 M960 32 V40 M960 304 V312" stroke="#2FA3D4" stroke-opacity=".6"/>

  <path d="M960 172 L960 244 M960 172 L898 136 M960 172 L1022 136" stroke="#2FA3D4" stroke-opacity=".18" stroke-dasharray="3 4"/>
  <path class="edge"    d="M960 100 L1022 136 L960 172 L898 136 Z"/>
  <path class="edge d1" d="M898 136 L898 208"/>
  <path class="edge d2" d="M1022 136 L1022 208"/>
  <path class="edge d3" d="M960 172 L960 244"/>
  <path class="edge d4" d="M898 208 L960 244"/>
  <path class="edge d5" d="M1022 208 L960 244"/>
  <rect class="vx" x="957" y="97" width="6" height="6" style="animation-delay:-0.0s"/><rect class="vx" x="895" y="133" width="6" height="6" style="animation-delay:-0.4s"/><rect class="vx" x="1019" y="133" width="6" height="6" style="animation-delay:-0.8s"/><rect class="vx" x="957" y="169" width="6" height="6" style="animation-delay:-1.2s"/><rect class="vx" x="895" y="205" width="6" height="6" style="animation-delay:-1.6s"/><rect class="vx" x="1019" y="205" width="6" height="6" style="animation-delay:-2.0s"/><rect class="vx" x="957" y="241" width="6" height="6" style="animation-delay:-2.4s"/>
  <rect class="scan" x="870" y="171" width="180" height="2" fill="url(#beam)"/>

  <text x="1088" y="76" class="mono" font-size="10" fill="#2FA3D4" letter-spacing="1">OBJ-01</text>
  <text x="1088" y="90" class="mono" font-size="10" fill="#8B9092" letter-spacing="1">MESH OK</text>
  <text x="832" y="272" class="mono" font-size="10" fill="#8B9092" letter-spacing="1" text-anchor="end">CODE → OBJECT</text>
</svg>
