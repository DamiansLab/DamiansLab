<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Process: Design, Build, Fabricate, Connect">
  <style>
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { stroke: #2FA3D4; stroke-opacity: .5; stroke-dasharray: 3 5; animation: flow 1s linear infinite; }
    .rail { animation: rail 6s ease-in-out infinite; transform-origin: 60px 0; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes rail { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .wire, .rail { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" stroke="#2FA3D4" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="1199" height="239" rx="2" fill="#181D20"/>
  <rect x=".5" y=".5" width="1199" height="239" rx="2" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="239" rx="2" stroke="#2F3437"/>
