    <text x="20" y="92" class="sans" font-size="14" fill="#9FA3A5">3D printing</text>
    <text x="20" y="111" class="sans" font-size="14" fill="#9FA3A5">Rapid prototyping</text>
  </g>
  <g transform="translate(906 52)">
    <rect x=".5" y=".5" width="233" height="127" rx="2" fill="#202528" stroke="#2F3437"/>
    <path d="M.75 12 V.75 H12 M222 127.25 H233.25 V116" stroke="#2FA3D4" stroke-width="1.5"/>
