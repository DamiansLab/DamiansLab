    <text x="20" y="66" class="sans" font-size="23" font-weight="700" fill="#E5E9EA">Code it</text>
    <text x="20" y="92" class="sans" font-size="14" fill="#9FA3A5">TypeScript · Next.js</text>
    <text x="20" y="111" class="sans" font-size="14" fill="#9FA3A5">AI agents · automation</text>
  </g>
  <g transform="translate(624 52)">
