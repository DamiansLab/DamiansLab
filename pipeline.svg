  <path class="wire" d="M576 116.0 H624"/>
  <path d="M617 112.0 L623 116.0 L617 120.0" stroke="#2FA3D4" stroke-width="1.5"/>
  <rect x="-3" y="-3" width="6" height="6" fill="#59B0DA"><animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M576 116.0 H616"/></rect>
  <path class="wire" d="M858 116.0 H906"/>
  <path d="M899 112.0 L905 116.0 L899 120.0" stroke="#2FA3D4" stroke-width="1.5"/>
  <rect x="-3" y="-3" width="6" height="6" fill="#59B0DA"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M858 116.0 H898"/></rect>
