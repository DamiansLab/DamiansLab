    <text x="20" y="30" class="mono" font-size="12" fill="#2FA3D4" letter-spacing="2">01 // DESIGN</text>
    <text x="216" y="30" class="mono" font-size="10" fill="#636869" text-anchor="end">01/04</text>
    <text x="20" y="66" class="sans" font-size="23" font-weight="700" fill="#E5E9EA">Model it</text>
    <text x="20" y="92" class="sans" font-size="14" fill="#9FA3A5">Fusion 360 · CAD</text>
    <text x="20" y="111" class="sans" font-size="14" fill="#9FA3A5">UI / UX sketches</text>
